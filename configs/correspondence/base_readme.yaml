# SPair-71k setting of the official README table (ViT-B, 768 px, s = 20).
# README reference values: original 30.1/46.8/55.6/61.2, debiased 33.7/52.6/62.5/68.7 (PCK@.05/.1/.15/.2).
_base_: ../base.yaml
model: {model_size: base, image_size: 768, svd_components: 20}
debias: {calibration_path: '${env:INSID3_CALIBRATION_PATH_BASE768,calibration/calib_base_768.pt}'}
data: {dataset: spair}
correspondence: {debiased: true, split: test}
run: {exp_name: corr_base768_hard}
